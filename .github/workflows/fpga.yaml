name: fpga
on: [push, workflow_dispatch]
jobs:
  fpga:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install FPGA tools
        run: sudo apt-get update && sudo apt-get install -y yosys nextpnr-ice40 fpga-icestorm
      - name: Build at the actual 25.2 MHz pixel clock
        run: make
      - uses: actions/upload-artifact@v7
        with:
          name: fabricfox-breakout
          path: |
            build/tt_um_breakout.bin
            build/synthesis.log
            build/nextpnr.log
