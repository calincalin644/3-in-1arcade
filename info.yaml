project:
  title: "Tiny Breakout + Pong + Pacman"
  author: "Calin"
  discord: ""
  description: "RGB222 VGA Breakout, Pong and Pacman with shared physics, lives, VGA and gamepad controls"
  language: "Verilog"
  clock_hz: 25200000
  tiles: "1x1"
  top_module: "tt_um_breakout"
  source_files:
    - "tt_um_breakout.v"
pinout:
  ui[0]: "Left button (active high)"
  ui[1]: "Right button (active high)"
  ui[2]: "Launch/restart button (active high)"
  ui[3]: "Game select bit 0: 0 Breakout, 1 Pong/Pacman (sampled during reset)"
  ui[4]: "Gamepad latch"
  ui[5]: "Gamepad serial clock"
  ui[6]: "Gamepad serial data"
  ui[7]: "Game select bit 1: 1 with ui[3]=1 selects Pacman (sampled during reset)"
  uo[0]: "Lives display: top segment a (3 lives)"
  uo[1]: "Lives display: segment b (always off)"
  uo[2]: "Lives display: segment c (always off)"
  uo[3]: "Lives display: bottom segment d (1-3 lives)"
  uo[4]: "Lives display: segment e (always off)"
  uo[5]: "Lives display: segment f (always off)"
  uo[6]: "Lives display: middle segment g (2-3 lives)"
  uo[7]: "Lives display: decimal point (off)"
  uio[0]: "VGA R1 (output)"
  uio[1]: "VGA G1 (output)"
  uio[2]: "VGA B1 (output)"
  uio[3]: "VGA VSYNC (output)"
  uio[4]: "VGA R0 (output)"
  uio[5]: "VGA G0 (output)"
  uio[6]: "VGA B0 (output)"
  uio[7]: "VGA HSYNC (output)"
yaml_version: 6
